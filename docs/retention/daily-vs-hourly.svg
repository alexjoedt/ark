  .pill { fill: #8be4f5; }
  .on-pill { fill: #0a0e13; }
  .lead { stroke: #8be4f5; }
  .arrow { stroke: #93a0ae; }
  .win { fill: #8be4f5; stroke: #8be4f5; }
  .hatch-line { stroke: #3a4552; }
}
</style>
