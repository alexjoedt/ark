<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720.0 167.0" width="720.0" height="167.0" role="img">
<title>--keep-tag release keeps 2 of 7 snapshots</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #2c3743; }
.muted { fill: #55626f; }
.bg { fill: #fbfcfd; stroke: #dde3ea; }
.band, .lane { fill: #f3f6f9; }
.band2 { fill: #e9eef3; }
.fade { fill: #fbfcfd; opacity: 0.65; }
