<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720.0 194.0" width="720.0" height="194.0" role="img">
<title>--keep-hourly 4 keeps 4 of 11 snapshots</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #2c3743; }
.muted { fill: #55626f; }
